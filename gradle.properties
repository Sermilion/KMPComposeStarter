## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options\="-Xmx3g" -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8 -XX\:+UseParallelGC
android.nonTransitiveRClass=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin incremental compilation
kotlin.incremental.multiplatform=true
kotlin.incremental=true

# KSP incremental processing
ksp.incremental=true
ksp.incremental.log=false

# Parallel model building for IDE sync (Gradle 9.4+). Kept on: sync is the slowest thing a
# contributor does on this repository, and the build has no cross-project model side effects.
org.gradle.tooling.parallel=true

# Base URL for the starter's HTTP client. The default host is intentionally fake: this
# template ships no backend. Override it here or with -Pstarter.api.baseUrl=...
starter.api.baseUrl=https://api.example.com/
