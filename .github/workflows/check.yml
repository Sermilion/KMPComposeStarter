name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `check` and the Android assembles are separate jobs because they were serial steps of one job
# that took the full hour and was cancelled by its own timeout. `check` alone - detekt over every
# source set, Android lint per module, the Kotest suites and Kover - is what costs that hour, so
# splitting moves the assembles off its critical path rather than merely raising the ceiling. They
# share the Gradle cache that `setup-gradle` writes.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Gradle check
        run: ./gradlew check

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results-*.*
            **/build/reports/tests/**
            **/build/reports/kover/**
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android debug and release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Android debug
        run: ./gradlew :androidApp:assembleDebug

      # The release variant is the one that runs R8. Without this step a broken shrinker config -
      # a missing ProGuard file, a keep rule deleted with the code it protected - only surfaces
      # for whoever first tries to ship the template.
      - name: Assemble Android release
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/lint-results-*.*
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS framework link
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify iOS framework linkability
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64

      # The commonTest specs are the only tests that run on a native target, and this is the only
      # runner that can execute them - the ubuntu job skips Apple compilations entirely. Without
      # this step "the shared specs run on iOS too" would be a claim nothing checks.
      - name: Run shared tests on the iOS simulator target
        run: ./gradlew :core:common:iosSimulatorArm64Test :core:data:iosSimulatorArm64Test

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            **/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
